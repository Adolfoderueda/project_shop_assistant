[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "openai>=2.8,<3", "python-telegram-bot>=22.5,<23", "playwright>=1.48,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools]
py-modules = ["config", "domain", "storage", "catalog", "restrictions", "conversation", "interpreter", "telegram_io", "offers"]
packages = ["stores"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
