name: Offline baseline

on:
  pull_request:
  push:
    branches: [feat/shop-assistant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        # Match the application's Windows PowerShell ACL subprocesses.
        # pwsh -> Python -> powershell inherits incompatible PS7 module paths.
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: python -m pip install -r requirements.lock
      - name: Install wheel build tools
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - name: Install Chromium for synthetic browser fixtures
        run: python -m playwright install chromium
      - name: Prepare synthetic probe workspace
        run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/Temp/opencode" | Out-Null
      - name: Ruff
        run: python -m ruff check .
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Synthetic Windows ACL diagnostic
        run: python -m scripts.ci_acl_probe
      - name: Full offline test suite
        run: python -m pytest -q
      - name: Build wheel offline
        run: python -m pip wheel . --no-deps --no-build-isolation --no-index --wheel-dir dist
      - name: Install wheel outside checkout
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --no-index --no-deps --target "$env:RUNNER_TEMP/wheel-installed" $wheel.FullName
      - name: Check installed wheel imports and resources
        run: |
          $check = Join-Path $env:GITHUB_WORKSPACE 'scripts/check_installed_wheel.py'
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'wheel-installed'
          Set-Location $env:RUNNER_TEMP
          python -P $check --installed-root $env:PYTHONPATH
