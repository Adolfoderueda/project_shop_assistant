name: TAK-80 exact-head offline

on:
  pull_request:
    branches: [TAK-6-e3-p3-current-public-prices]
    paths:
      - ".github/workflows/tak80-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: tak80-exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TESTED_SHA: 2b0c0a932291cb18bb7e7d57098d6191c6b8cbf8
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout CI workflow branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout immutable candidate
        uses: actions/checkout@v6
        with:
          ref: 2b0c0a932291cb18bb7e7d57098d6191c6b8cbf8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tested SHA
        run: |
          $actual = (git -C candidate rev-parse HEAD).Trim()
          Write-Host "Workflow file SHA: $env:WORKFLOW_SHA"
          Write-Host "Workflow event SHA: $env:GITHUB_SHA"
          Write-Host "Tested candidate SHA: $actual"
          if ($actual -ne $env:TESTED_SHA) {
            throw "Candidate SHA mismatch: expected $env:TESTED_SHA, got $actual"
          }
      - name: Install locked test dependencies
        working-directory: candidate
        run: python -m pip install -r requirements.lock
      - name: Install wheel build tools
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - name: Install Chromium for synthetic browser fixtures
        working-directory: candidate
        run: python -m playwright install chromium
      - name: Prepare synthetic probe workspace
        run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/Temp/opencode" | Out-Null
      - name: Ruff
        working-directory: candidate
        run: python -m ruff check .
      - name: Whitespace check for candidate commit
        working-directory: candidate
        run: git diff --check "$env:TESTED_SHA^" "$env:TESTED_SHA"
      - name: Full offline test suite
        working-directory: candidate
        run: python -m pytest -q
      - name: Build wheel offline
        working-directory: candidate
        run: python -m pip wheel . --no-deps --no-build-isolation --no-index --wheel-dir dist
      - name: Install wheel outside checkout
        working-directory: candidate
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --no-index --no-deps --target "$env:RUNNER_TEMP/wheel-installed" $wheel.FullName
      - name: Check installed wheel imports
        working-directory: candidate
        run: |
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'wheel-installed'
          Set-Location $env:RUNNER_TEMP
          python -P -c "import importlib, pathlib, sys; root=pathlib.Path(sys.argv[1]).resolve(); names=('shop_assistant','stores','stores.mercadona','catalog'); mods=[importlib.import_module(name) for name in names]; assert all(pathlib.Path(module.__file__).resolve().is_relative_to(root) for module in mods); print('PASS: exact wheel imports')" $env:PYTHONPATH
